name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore JevEnterpriseDecisionFabric.sln
      - name: Build
        run: dotnet build JevEnterpriseDecisionFabric.sln --configuration Release --no-restore -warnaserror
      - name: Test
        run: dotnet test JevEnterpriseDecisionFabric.sln --configuration Release --no-build
      - name: Validate evaluation datasets
        run: |
          shopt -s nullglob
          datasets=(evals/datasets/*.json)
          if [ ${#datasets[@]} -eq 0 ]; then
            echo "No dataset found under evals/datasets."
            exit 1
          fi
          for dataset in "${datasets[@]}"; do
            echo "::group::$dataset"
            dotnet run --project evals/DecisionFabric.Evals --configuration Release --no-build -- \
              --dataset "$dataset" --dry-run
            echo "::endgroup::"
          done
